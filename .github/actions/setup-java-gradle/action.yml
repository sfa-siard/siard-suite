name: setup-java-gradle
description: Set up Zulu JDK 21 and Gradle with dependency caching

inputs:
  javafx:
    description: Install the Zulu JDK build with bundled JavaFX (jdk+fx)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'zulu'
        java-package: ${{ inputs.javafx == 'true' && 'jdk+fx' || 'jdk' }}
    - uses: gradle/actions/setup-gradle@v4
