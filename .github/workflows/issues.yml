name: Add issues to project

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/users/sfa-siard/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
