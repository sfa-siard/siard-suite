name: poc-web-installer

# PoC-only workflow: builds the siard-web companion installers.
# Scoped to the PoC branch; not part of the release deliverables.

on:
  push:
    branches: [ 'poc/executable-web-companion-application' ]
  workflow_dispatch:

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jpackage installer
        run: ./gradlew :siard-web-backend-poc:jpackage --no-daemon
        shell: bash

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: siard-web-poc-${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
          path: |
            siard-web-backend-poc/build/jpackage/**/*.exe
            siard-web-backend-poc/build/jpackage/**/*.msi
            siard-web-backend-poc/build/jpackage/**/*.deb
          if-no-files-found: warn
