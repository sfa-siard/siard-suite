# This workflow will build a Java project with Gradle, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: build-on-windows

on:
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set TAG-Env
        run: echo "NAME_TAG=SIARD-Suite-${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          java-package: "jdk+fx"
          cache: "gradle"

      - name: Java Version
        run: java -version

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Execute Gradle build (Windows debug)
        shell: bash
        run: |
          ./gradlew build -x test --info --console=plain --stacktrace 2>&1 | tee gradle.log

      - name: Upload Gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-windows
          path: gradle.log
