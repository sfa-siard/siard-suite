name: Integration Tests (siard-cmd)

on:
  pull_request:
    branches: [ main ]

  workflow_dispatch:

env:
  TZ: Europe/Zurich

jobs:
  execute-unit-and-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: "gradle"
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Run integration tests
        run: ./gradlew :siard-cmd:integrationTest
      - name: Dump Docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a
          echo "=== Docker logs ==="
          docker ps -a -q | xargs -I {} docker logs {}
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            siard-cmd/build/reports/
            siard-cmd/build/test-results/
