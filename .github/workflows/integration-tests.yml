name: Integration Tests (siard-cmd)

on:
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  execute-unit-and-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Run integration tests
        run: ./gradlew :siard-cmd:integrationTest
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/siard-cmd/build/reports/
            **/siard-cmd/build/test-results/
