# Builds the distributable packages:
# - every push to main / workflow_dispatch: zipped distributions without a bundled runtime
# - every v* tag (or manual dispatch): additionally the runtime-bundled zips for Windows and
#   Linux (no macOS) and the .deb/.msi installers
name: Packages

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  TZ: Europe/Zurich

jobs:
  dist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          # the axion version plugin needs the tags to compute the version
          fetch-depth: 0
      - uses: ./.github/actions/setup-java-gradle
        with:
          javafx: 'true'
      - name: Set artifact prefix
        run: |
          ref_name="${GITHUB_REF#refs/*/}"
          echo "NAME_TAG=$(echo "siard-suite-${ref_name//\//-}" | tr 'A-Z' 'a-z')" >> $GITHUB_ENV
      - name: Build zipped distributions (no bundled runtime)
        run: ./gradlew :siard-suite-app:asciidoctorPdf :siard-suite-app:distZip :siard-cmd:distZip :siard-web:local:backend:siardwebDistZip --no-daemon
      - name: Collect distribution files
        shell: bash
        run: |
          shopt -s nullglob
          norm() { basename "$1" | tr 'A-Z' 'a-z' | sed -E 's/-(linux|win|mac)(\.[a-z0-9]+)$/\2/' | tr '_' '-' | sed -E 's/([a-z])\.([0-9])/\1-\2/'; }
          mkdir -p artifacts/dists
          for f in siard-suite-app/build/distributions/*.zip siard-cmd/build/distributions/*.zip siard-web/local/backend/build/distributions/*.zip; do
            cp "$f" "artifacts/dists/$(norm "$f")"
          done
      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}-dists
          path: artifacts/dists/*
      - name: Upload user manual
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}-user-manual.pdf
          path: siard-suite-app/build/docs/pdf/en/user-manual.pdf

  packages:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    name: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-java-gradle
        with:
          javafx: 'true'
      - name: Set artifact prefix
        shell: bash
        run: |
          ref_name="${GITHUB_REF#refs/*/}"
          echo "NAME_TAG=$(echo "siard-suite-${ref_name//\//-}" | tr 'A-Z' 'a-z')" >> $GITHUB_ENV
          echo "ARTIFACT_OS=$(echo "$RUNNER_OS" | tr 'A-Z' 'a-z')" >> $GITHUB_ENV
      - name: Build runtime images and installers
        shell: bash
        run: ./gradlew :siard-suite-app:build -x test :siard-suite-app:runtimeZip :siard-suite-app:jpackage :siard-cmd:runtimeZip :siard-cmd:verifyRuntimeImage :siard-cmd:jpackage :siard-web:local:backend:runtimeZip :siard-web:local:backend:jpackage --no-daemon
      - name: Collect artifacts
        shell: bash
        run: |
          shopt -s nullglob
          norm() { basename "$1" | tr 'A-Z' 'a-z' | sed -E 's/-(linux|win|mac)(\.[a-z0-9]+)$/\2/' | tr '_' '-' | sed -E 's/([a-z])\.([0-9])/\1-\2/'; }
          mkdir -p artifacts/runtime artifacts/deb artifacts/msi
          for f in siard-suite-app/build/image-zip/*.zip siard-cmd/build/image-zip/*.zip siard-web/local/backend/build/image-zip/*.zip; do
            cp "$f" "artifacts/runtime/$(norm "$f")"
          done
          for f in siard-suite-app/build/jpackage/*.{deb,msi} siard-cmd/build/installers/*.{deb,msi} siard-web/local/backend/build/jpackage/*.{deb,msi}; do
            case "$f" in
              *.deb) d=deb ;;
              *.msi) d=msi ;;
            esac
            cp "$f" "artifacts/$d/$(norm "$f")"
          done
      - name: Upload runtime zips
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}-runtime-${{ env.ARTIFACT_OS }}
          path: artifacts/runtime/*
      - name: Upload DEB installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}-linux-deb
          path: artifacts/deb/*
      - name: Upload MSI installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}-win-msi
          path: artifacts/msi/*
