name: Test Suite

on:
  push:
    branches: [ "main", "feature/*", "issue/*", "doc/*" ]
  pull_request:
    branches: [ "main" ]

env:
  TZ: Europe/Zurich

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          java-package: "jdk+fx"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Show version
        run: ./gradlew cV
      - name: Compile all modules
        run: ./gradlew compileJava compileTestJava -x test

  unit-tests:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - siard-utilities
          - zip64-file
          - sql-parser
          - siard-api
          - jdbc-base
          - jdbc-oracle
          - jdbc-access
          - jdbc-db2
          - jdbc-mssql
          - jdbc-mysql
          - jdbc-postgres
          - siard-cmd
          - siard-suite-app
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          java-package: "jdk+fx"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:test -Djava.awt.headless=true -Dtestfx.headless=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/tests/

  local-web-app:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('siard-suite-local-web-app/frontend/package-lock.json') }}
      - name: Check local web app
        run: ./gradlew :siard-suite-local-web-app:check
      - name: Run Playwright smoke test
        run: ./gradlew :siard-suite-local-web-app:e2eTest
