# Packages the local web app agent: Windows/Linux installers (jpackage) and a macOS runtime zip.
# Runs on PRs and main pushes so packaging regressions in the siard-cmd dependency chain surface
# before merge; siard-suite-app, docs and markdown-only changes are ignored (design D14).
name: Build local web app packages

on:
  pull_request:
    paths-ignore:
      - 'siard-suite-app/**'
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'siard-suite-app/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # cancel outdated PR packaging runs; every merge to main produces packages
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          # the axion version plugin needs the tags to compute the version
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build installer (Windows/Linux)
        if: runner.os != 'macOS'
        run: ./gradlew :siard-suite-local-web-app:backend:jpackage --no-daemon
      - name: Build runtime zip (macOS)
        if: runner.os == 'macOS'
        run: ./gradlew :siard-suite-local-web-app:backend:runtimeZip --no-daemon
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: siard-suite-web-${{ runner.os }}-installer
          path: |
            siard-suite-local-web-app/backend/build/jpackage/*.msi
            siard-suite-local-web-app/backend/build/jpackage/*.exe
          if-no-files-found: error
      - name: Upload DEB
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: siard-suite-web-${{ runner.os }}-deb
          path: siard-suite-local-web-app/backend/build/jpackage/*.deb
          if-no-files-found: error
      - name: Upload macOS runtime zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: siard-suite-web-${{ runner.os }}-zip
          path: siard-suite-local-web-app/backend/build/image-zip/*.zip
          if-no-files-found: error
