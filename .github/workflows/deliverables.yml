# understands how to build platform specific binaries that ship with the necessary java runtime
name: Create standalone deliverables for SIARD (installers and distributions with runtimes)

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set TAG-Env
        run: echo "NAME_TAG=SIARD-Suite-${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          java-package: "jdk+fx"
          cache: "gradle"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Show current application version
        run: ./gradlew cV
      - name: Execute Gradle build
        run: ./gradlew siard-suite-app:build -Djava.awt.headless=true -Dtestfx.headless=true --no-daemon
      - name: Build siard-cmd distributions
        run: ./gradlew siard-cmd:assembleDist --no-daemon
      - name: upload zip archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}
          path: siard-suite-app/build/distributions/SIARD-Suite-*.zip
      - name: upload siard-cmd distributions
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}-siard-cmd
          path: siard-cmd/build/distributions/
      - name: upload siard-manual.pdf
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}-user-manual.pdf
          path: siard-suite-app/build/docs/pdf/en/user-manual.pdf

  native-packages:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        java: [ '21' ]
      fail-fast: false
    name: ${{ matrix.os }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
      - name: Set TAG-Env
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          echo "NAME_TAG=SIARD-Suite-${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
          echo "CLI_TAG=siard-cli-${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Set TAG-Env Windows
        if: runner.os == 'Windows'
        run: |
          echo "NAME_TAG=SIARD-Suite-${{ github.ref_name }}" >> $env:GITHUB_ENV
          echo "CLI_TAG=siard-cli-${{ github.ref_name }}" >> $env:GITHUB_ENV
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          java-package: "jdk+fx"
          cache: "gradle"
      - name: Echo JAVA_HOME
        run: echo $JAVA_HOME
      - name: Install rpm build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Execute build runtimeZip jpackage (SIARD Suite app)
        run: ./gradlew :siard-suite-app:build :siard-suite-app:runtimeZip :siard-suite-app:jpackage --no-daemon
      - name: Execute build runtimeZip jpackage (siard CLI)
        run: ./gradlew :siard-cmd:runtimeZip :siard-cmd:verifyRuntimeImage :siard-cmd:jpackage --no-daemon
      - name: "Build second CLI installer type (Windows: exe)"
        if: runner.os == 'Windows'
        run: ./gradlew :siard-cmd:jpackage -PinstallerType=exe --no-daemon
      - name: "Build second CLI installer type (Linux: rpm)"
        if: runner.os == 'Linux'
        run: ./gradlew :siard-cmd:jpackage -PinstallerType=rpm --no-daemon
      - name: Upload DMG as an artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}-${{ runner.os }}-dmg
          path: siard-suite-app/build/jpackage/*.dmg
          if-no-files-found: error
      - name: Upload MSI as an artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}-win-msi
          path: siard-suite-app/build/jpackage/*.msi
          if-no-files-found: error
      - name: Upload DEB as an artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}-${{ runner.os }}-deb
          path: siard-suite-app/build/jpackage/*.deb
          if-no-files-found: error
      - name: Upload application image zip
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.NAME_TAG }}-${{ runner.os }}
          path: siard-suite-app/build/image-zip/*.zip
          if-no-files-found: error
      - name: Upload CLI image zip
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.CLI_TAG }}-${{ runner.os }}-image
          path: siard-cmd/build/image-zip/siard-cli-*.zip
          if-no-files-found: error
      - name: Upload CLI MSI as an artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.CLI_TAG }}-win-msi
          path: siard-cmd/build/jpackage/*.msi
          if-no-files-found: error
      - name: Upload CLI EXE as an artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.CLI_TAG }}-win-exe
          path: siard-cmd/build/jpackage/*.exe
          if-no-files-found: error
      - name: Upload CLI DEB as an artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.CLI_TAG }}-linux-deb
          path: siard-cmd/build/jpackage/*.deb
          if-no-files-found: error
      - name: Upload CLI RPM as an artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.CLI_TAG }}-linux-rpm
          path: siard-cmd/build/jpackage/*.rpm
          if-no-files-found: error
      - name: Upload CLI DMG as an artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.CLI_TAG }}-mac-dmg
          path: siard-cmd/build/jpackage/*.dmg
          if-no-files-found: error
