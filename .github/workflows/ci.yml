name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  TZ: Europe/Zurich

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - siard-utilities
          - zip64-file
          - sql-parser
          - siard-api
          - jdbc-base
          - jdbc-oracle
          - jdbc-access
          - jdbc-db2
          - jdbc-mssql
          - jdbc-mysql
          - jdbc-postgres
          - siard-cmd
          - siard-suite-app
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-java-gradle
        with:
          javafx: 'true'
      - name: Test ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:test -Djava.awt.headless=true -Dtestfx.headless=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/tests/

  local-web-app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-java-gradle
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('siard-suite-local-web-app/frontend/package-lock.json') }}
      - name: Check local web app
        run: ./gradlew :siard-suite-local-web-app:check
      - name: Run Playwright smoke test
        run: ./gradlew :siard-suite-local-web-app:e2eTest

  integration-tests:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: postgres
            task: integrationTestPostgres
          - name: mysql
            task: integrationTestMysql
          - name: mariadb
            task: integrationTestMariadb
          - name: mssql
            task: integrationTestMssql
          - name: oracle
            task: integrationTestOracle
          - name: db2
            task: integrationTestDb2
          - name: msaccess
            task: integrationTestMsaccess
          - name: utils
            task: integrationTestUtils
    name: Integration Tests (${{ matrix.database.name }})
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-java-gradle
      - name: Run ${{ matrix.database.name }} integration tests
        run: ./gradlew :siard-cmd:${{ matrix.database.task }}
      - name: Dump Docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a
          echo "=== Docker logs ==="
          docker ps -a -q | xargs -I {} docker logs {}
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-reports-${{ matrix.database.name }}
          path: |
            siard-cmd/build/reports/
            siard-cmd/build/test-results/

  sonar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-java-gradle
        with:
          javafx: 'true'
      - name: SonarQube analysis
        run: ./gradlew sonar --parallel -Djava.awt.headless=true -Dtestfx.headless=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
