name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  TZ: Europe/Zurich

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - siard-utilities
          - zip64-file
          - sql-parser
          - siard-api
          - jdbc-base
          - jdbc-oracle
          - jdbc-access
          - jdbc-db2
          - jdbc-mssql
          - jdbc-mysql
          - jdbc-postgres
          - siard-cmd
          - siard-suite-app
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-java-gradle
        with:
          javafx: 'true'
      - name: Test ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:test -Djava.awt.headless=true -Dtestfx.headless=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/tests/

  local-web-app:
    name: Local web app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            playwright-cache: ~/.cache/ms-playwright
          - os: windows-latest
            playwright-cache: ~/AppData/Local/ms-playwright
          - os: macos-latest
            playwright-cache: ~/Library/Caches/ms-playwright
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-java-gradle
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ${{ matrix.playwright-cache }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('siard-web/package-lock.json') }}
      # lint/typecheck/unit tests only run on Linux - should not be different on other os - should it?
      # only run e2e tests on mac and windows too
      - name: Check web modules (core, shared frontend, local app)
        if: runner.os == 'Linux'
        run: ./gradlew :siard-web:check
      - name: Run Playwright browser tests
        run: ./gradlew :siard-web:local:e2eTest
      - name: Upload browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-web-browser-results-${{ matrix.os }}-${{ runner.arch }}
          path: |
            siard-web/local/frontend/playwright-report/
            siard-web/local/frontend/test-results/
          retention-days: 7
          if-no-files-found: warn

  integration-tests:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: postgres
            task: integrationTestPostgres
          - name: mysql
            task: integrationTestMysql
          - name: mariadb
            task: integrationTestMariadb
          - name: mssql
            task: integrationTestMssql
          - name: oracle
            task: integrationTestOracle
          - name: db2
            task: integrationTestDb2
          - name: msaccess
            task: integrationTestMsaccess
          - name: utils
            task: integrationTestUtils
    name: Integration Tests (${{ matrix.database.name }})
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-java-gradle
      - name: Run ${{ matrix.database.name }} integration tests
        run: ./gradlew :siard-cmd:${{ matrix.database.task }}
      - name: Dump Docker logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a
          echo "=== Docker logs ==="
          docker ps -a -q | xargs -I {} docker logs {}
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-reports-${{ matrix.database.name }}
          path: |
            siard-cmd/build/reports/
            siard-cmd/build/test-results/

  sonar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-java-gradle
        with:
          javafx: 'true'
      - name: SonarQube analysis
        run: ./gradlew sonar --parallel -Djava.awt.headless=true -Dtestfx.headless=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
