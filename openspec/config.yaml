schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
context: |
  Only free, open-source-licensed dependencies (e.g. MUI core and @mui/x-* Community tiers, MIT).
  If a feature would need a paid license, look for an open-source
  alternative or, if there is none, ask what to do.
  Everything must run on Windows, macOS and Linux; designs and tasks must cover all three.
  Which platforms get installers is decided per change.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
  specs:
    - >-
      Every requirement needs 3 scenario types: happy path, error/edge case, and
      authorization. For tools with no roles/permissions model (CLI, desktop apps),
      use credential/input-security scenarios instead (e.g. no credential leakage
      in logs or output, rejection of malformed input). For the local web app
      (no roles, per-launch session), the authorization scenario is the
      missing or invalid session case. Never omit it.
    - >-
      Every GIVEN/WHEN/THEN must be measurable: write "returns 201", not "the
      system works correctly".
  tasks:
    - >-
      A verification step that needs a remote run (CI, workflow_dispatch, a manual
      check on another OS) is written as a separate user step that names the exact
      command and what to check. The agent does not mark it done without the
      user's report.
    - >-
      A task that removes or replaces existing tests must first record a
      coverage-equivalence matrix in design.md (each removed assertion -> its
      replacement), and the removal is a separate task that needs the user's
      explicit approval.

# Per-operation guidance (optional)
# Guidance for how apply and archive should be conducted.
# This is separate from artifact rules above.

operations:
  apply:
    guidance:
      - >-
        Do not implement behavior that isn't described in a spec scenario. If you
        find behavior is needed that no scenario covers, update the spec first,
        then implement.
      - >-
        Before asking, check AGENTS.md, the change's artifacts, and existing
        codebase patterns. Decide and proceed on structural choices (layer
        placement, reuse vs. new helper, naming), recording each with a one-line
        reason in design.md (create it if missing). Ask only about uncovered behavior, public API or
        schema changes, security, or anything hard to reverse.
      - >-
        Before applying a task, check that every file path and Gradle task it
        names exists. If one was renamed or removed meanwhile, update the change's
        artifacts first and say so.
      - >-
        When all tasks are complete, run the openspec-verify-change skill on this
        change and fix any CRITICAL issues before reporting done.
      - >-
        As part of that verification, check every requirement in the change's
        delta specs against the specs rules above. A requirement missing a
        required scenario type is a CRITICAL issue.
  archive:
    guidance:
      - >-
        Before archiving, review this change for harness gaps: questions AGENTS.md
        didn't answer, questions you had to ask the user, undocumented patterns you
        applied, quality issues an openspec/config.yaml rule would have prevented,
        scenario types that should be mandatory, and recurring decisions that
        should become rules.
      - >-
        Append each gap to openspec/agent-guidance-suggestions.md under "## Harness Suggestions" as
        "Suggestion: [change] in [AGENTS.md | openspec/config.yaml | .agents/skills/]"
        followed by "Reason: [the specific ambiguity or decision that prompted it]".
        Do not edit AGENTS.md or config.yaml directly. If there are no gaps, add nothing.
