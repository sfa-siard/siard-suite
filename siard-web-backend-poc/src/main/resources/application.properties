quarkus.http.host=127.0.0.1
quarkus.http.port=${siard.agent.port:0}
%dev.quarkus.http.port=8080
# fast-jar layout is required: QuarkusEntryPoint resolves quarkus/quarkus-application.dat
# relative to the run jar's parent directory (an uber-jar only works via java -jar)
quarkus.package.jar.type=fast-jar
