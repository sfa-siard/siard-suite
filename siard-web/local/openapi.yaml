---
openapi: 3.1.0
components:
  schemas:
    AgentEvent:
      oneOf:
      - $ref: "#/components/schemas/ConnectedEvent"
      discriminator:
        propertyName: type
        mapping:
          connected: "#/components/schemas/ConnectedEvent"
      type: object
    ArchiveDto:
      type: object
      properties:
        dbName:
          type: string
        description:
          type: string
        dataOwner:
          type: string
        dataOriginTimespan:
          type: string
        archiver:
          type: string
        archiverContact:
          type: string
        archivalDate:
          $ref: "#/components/schemas/LocalDate"
        version:
          type: string
        schemas:
          type: array
          items:
            $ref: "#/components/schemas/SchemaRef"
    CellDto:
      oneOf:
      - $ref: "#/components/schemas/NullCell"
      - $ref: "#/components/schemas/TextCell"
      - $ref: "#/components/schemas/LobCell"
      discriminator:
        propertyName: type
        mapping:
          "null": "#/components/schemas/NullCell"
          text: "#/components/schemas/TextCell"
          lob: "#/components/schemas/LobCell"
      type: object
    ColumnDto:
      type: object
      properties:
        index:
          type: integer
          format: int32
        name:
          type: string
        type:
          type: string
        nullable:
          type: boolean
        description:
          type: string
        lob:
          type: boolean
    ConnectedEvent:
      type: object
    DbmsCatalogEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDescriptor"
        examples:
          type: object
          additionalProperties:
            type: string
    EntryInfo:
      description: A file or folder looked up by its path
      type: object
      required:
      - path
      - name
      - folder
      - modified
      - hidden
      - writable
      properties:
        path:
          type: string
          description: "Absolute, normalised path"
        name:
          type: string
        parent:
          type: string
          description: Parent folder; null at a root
        folder:
          type: boolean
        size:
          type: integer
          format: int64
          description: Size in bytes; null for folders
        modified:
          type: string
          description: "Last modification, ISO-8601 instant"
        hidden:
          type: boolean
        writable:
          type: boolean
          description: "Whether the user may write the file, or create files in the\
            \ folder"
    FieldDescriptor:
      type: object
      properties:
        key:
          type: string
        type:
          type: string
        required:
          type: boolean
    FileEntry:
      description: A file or folder in a listing
      type: object
      required:
      - name
      - path
      - folder
      - modified
      - hidden
      properties:
        name:
          type: string
        path:
          type: string
          description: Absolute path
        folder:
          type: boolean
        size:
          type: integer
          format: int64
          description: Size in bytes; null for folders
        modified:
          type: string
          description: "Last modification, ISO-8601 instant"
        hidden:
          type: boolean
    FolderListing:
      description: The entries of a folder
      type: object
      required:
      - path
      - entries
      - truncated
      properties:
        path:
          type: string
          description: "Absolute, normalised path of the folder"
        parent:
          type: string
          description: Parent folder; null at a root
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
        truncated:
          type: boolean
          description: True when entries beyond the limit were left out
    Instant:
      type: string
      format: date-time
      examples:
      - 2022-03-10T16:15:50Z
    LobCell:
      type: object
      properties:
        length:
          type: integer
          format: int64
    LocalDate:
      type: string
      format: date
      examples:
      - 2022-03-10
    NullCell:
      type: object
    Place:
      description: A starting place of the file chooser
      type: object
      required:
      - kind
      - path
      properties:
        kind:
          type: string
          enum:
          - home
          - desktop
          - documents
          - downloads
          - root
        path:
          type: string
          description: Absolute path
    RevealRequest:
      description: The entry to show in the system file manager
      type: object
      required:
      - path
      properties:
        path:
          type: string
          description: Absolute path
    RowDto:
      type: object
      properties:
        row:
          type: integer
          format: int64
        cells:
          type: array
          items:
            $ref: "#/components/schemas/CellDto"
    RowsDto:
      type: object
      properties:
        total:
          type: integer
          format: int64
        offset:
          type: integer
          format: int64
        rows:
          type: array
          items:
            $ref: "#/components/schemas/RowDto"
    SaveConnectionRequest:
      type: object
      properties:
        name:
          type: string
        dbmsId:
          type: string
        host:
          type: string
        port:
          type: string
        dbName:
          type: string
        user:
          type: string
        options:
          type: string
    SavedConnection:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        dbmsId:
          type: string
        host:
          type: string
        port:
          type: string
        dbName:
          type: string
        user:
          type: string
        options:
          type: string
        file:
          type: string
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
    SchemaDto:
      type: object
      properties:
        index:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableRef"
        views:
          type: array
          items:
            $ref: "#/components/schemas/ViewRef"
    SchemaRef:
      type: object
      properties:
        index:
          type: integer
          format: int32
        name:
          type: string
    SearchDto:
      type: object
      properties:
        found:
          type: boolean
        row:
          type: integer
          format: int64
        column:
          type: integer
          format: int32
        complete:
          type: boolean
        nextRow:
          type: integer
          format: int64
    SystemInfo:
      type: object
      required:
      - appVersion
      - javaVersion
      - jdbcDrivers
      properties:
        appVersion:
          type: string
        javaVersion:
          type: string
        jdbcDrivers:
          type: array
          items:
            type: string
    TableDto:
      type: object
      properties:
        index:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        rows:
          type: integer
          format: int64
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnDto"
    TableRef:
      type: object
      properties:
        index:
          type: integer
          format: int32
        name:
          type: string
        rows:
          type: integer
          format: int64
    TextCell:
      type: object
      properties:
        value:
          type: string
        truncated:
          type: boolean
    ViewDto:
      type: object
      properties:
        index:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        query:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnDto"
    ViewRef:
      type: object
      properties:
        index:
          type: integer
          format: int32
        name:
          type: string
paths:
  /api/archives/{archiveId}:
    parameters:
    - name: archiveId
      in: path
      required: true
      schema:
        type: string
    delete:
      responses:
        "204":
          description: No Content
      summary: Close
      tags:
      - Archive Resource
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveDto"
      summary: Archive
      tags:
      - Archive Resource
  /api/archives/{archiveId}/schemas/{s}:
    parameters:
    - name: archiveId
      in: path
      required: true
      schema:
        type: string
    get:
      parameters:
      - name: s
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaDto"
      summary: Schema
      tags:
      - Archive Resource
  /api/archives/{archiveId}/schemas/{s}/tables/{t}:
    parameters:
    - name: archiveId
      in: path
      required: true
      schema:
        type: string
    get:
      parameters:
      - name: s
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: t
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableDto"
      summary: Table
      tags:
      - Archive Resource
  /api/archives/{archiveId}/schemas/{s}/tables/{t}/rows:
    parameters:
    - name: archiveId
      in: path
      required: true
      schema:
        type: string
    get:
      parameters:
      - name: s
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: t
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        schema:
          type: string
      - name: offset
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowsDto"
      summary: Rows
      tags:
      - Archive Resource
  /api/archives/{archiveId}/schemas/{s}/tables/{t}/rows/{row}/columns/{c}/content:
    parameters:
    - name: archiveId
      in: path
      required: true
      schema:
        type: string
    get:
      parameters:
      - name: c
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: row
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: s
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: t
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/octet-stream: {}
      summary: Content
      tags:
      - Archive Resource
  /api/archives/{archiveId}/schemas/{s}/tables/{t}/search:
    parameters:
    - name: archiveId
      in: path
      required: true
      schema:
        type: string
    get:
      parameters:
      - name: s
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: t
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: afterRow
        in: query
        schema:
          type: string
      - name: matchCase
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchDto"
      summary: Search
      tags:
      - Archive Resource
  /api/archives/{archiveId}/schemas/{s}/views/{v}:
    parameters:
    - name: archiveId
      in: path
      required: true
      schema:
        type: string
    get:
      parameters:
      - name: s
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: v
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewDto"
      summary: View
      tags:
      - Archive Resource
  /api/connections:
    get:
      summary: "All saved connections, ordered by name"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedConnection"
      tags:
      - Connections Resource
    post:
      summary: Save a connection profile; the name must be unique
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveConnectionRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedConnection"
        "400":
          description: Bad Request
        "409":
          description: Conflict
      tags:
      - Connections Resource
  /api/connections/{id}:
    put:
      summary: Update a saved connection profile; the name must stay unique
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveConnectionRequest"
        required: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedConnection"
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "409":
          description: Conflict
      tags:
      - Connections Resource
    delete:
      summary: Delete a saved connection by id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not Found
      tags:
      - Connections Resource
  /api/dbms:
    get:
      summary: Catalog of the supported server-based DBMS
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DbmsCatalogEntry"
      tags:
      - Dbms Resource
  /api/events:
    get:
      summary: Event stream of the agent; each event's data is an AgentEvent
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AgentEvent"
      tags:
      - Events Resource
  /api/files:
    get:
      summary: "List a folder: folders first, then files, each by name ignoring case;\
        \ at most 10000 entries"
      parameters:
      - description: "Keep only files ending with one of these, ignoring case, e.g.\
          \ .siard"
        name: extension
        in: query
        schema:
          type: array
          items:
            type: string
      - description: Leave out all files
        name: foldersOnly
        in: query
        schema:
          type: boolean
      - description: Include hidden entries
        name: hidden
        in: query
        schema:
          type: boolean
      - description: Absolute folder path
        required: true
        name: path
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
        "400":
          description: "Malformed or relative path, or not a folder"
        "403":
          description: The folder may not be read
        "404":
          description: Nothing exists at the path
        "503":
          description: All listing workers are busy
        "504":
          description: The location did not respond within 10 seconds
      tags:
      - Files Resource
  /api/files/entry:
    get:
      summary: Look up one file or folder by its absolute path
      parameters:
      - description: Absolute path
        required: true
        name: path
        in: query
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryInfo"
        "400":
          description: Malformed or relative path
        "404":
          description: Nothing exists at the path
      tags:
      - Files Resource
  /api/files/places:
    get:
      summary: "Starting places: home, Desktop, Documents, Downloads (if they exist)\
        \ and the roots"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Place"
      tags:
      - Files Resource
  /api/files/reveal:
    post:
      summary: "Show a file selected in the system file manager, or open a folder\
        \ there"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealRequest"
        required: true
      responses:
        "204":
          description: The file manager was started
        "400":
          description: Malformed or relative path
        "404":
          description: Nothing exists at the path
        "503":
          description: No file manager could be started
      tags:
      - Files Resource
  /api/system/info:
    get:
      summary: Version and runtime of the agent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
      tags:
      - System Resource
info:
  title: SIARD Suite local agent API
  version: "1"
