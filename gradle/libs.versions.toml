[versions]
# Plugins
axion-release = "1.21.1"
lombok-plugin = "8.14.2"
lombok = "1.18.38"
beryx-runtime = "1.12.7"
asciidoctor = "3.3.2"
plantuml = "1.6.0"
dependency-analysis = "3.6.1"

# Core Libraries
antlr = "4.6"
commons-lang = "2.6"
commons-logging = "1.3.6"
commons-text = "1.15.0"
tika = "3.2.3"

# Database Drivers
postgresql = "42.7.11"
mysql = "8.3.0"
mssql = "13.4.0.jre11"
oracle-ojdbc = "19.3.0.0"
db2-license = "1.1"
mariadb = "2.7.4"

# JAXB & XML
jaxb-api = "2.3.0"
jaxb-impl = "2.3.9"
woodstox-stax2 = "4.3.0"
woodstox-core = "4.1.2"

# Testing
junit-bom = "5.13.4"
junit4 = "4.13.2"
testcontainers = "1.21.4"
hamcrest = "2.2"
assertj = "3.26.3"
mockito = "5.19.0"

# JavaFX
javafx = "17.0.7"
materialfx = "11.13.5"

# Other
jackcess = "2.1.12"
json-simple = "1.1.1"
jts-core = "1.14.0"
msv-core = "2010.2"
xsdlib = "2013.2.2"
jsoup = "1.21.2"
logback = "1.5.18"
jackson = "2.18.2"
mslinks = "1.0.6.2"
jetbrains-annotations = "24.1.0"
testfx = "4.0.16-alpha"
bouncycastle = "1.84"

[libraries]
# ANTLR
antlr4-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }
antlr4 = { module = "org.antlr:antlr4", version.ref = "antlr" }
antlr4-master = { module = "org.antlr:antlr4-master", version.ref = "antlr" }

# Apache Commons
commons-lang = { module = "commons-lang:commons-lang", version.ref = "commons-lang" }
commons-logging = { module = "commons-logging:commons-logging", version.ref = "commons-logging" }
commons-text = { module = "org.apache.commons:commons-text", version.ref = "commons-text" }

# Apache Tika
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Database Drivers
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
oracle-xdb = { module = "com.oracle.ojdbc:xdb", version.ref = "oracle-ojdbc" }
oracle-xmlparser = { module = "com.oracle.ojdbc:xmlparserv2", version.ref = "oracle-ojdbc" }
db2-license = { module = "com.mysitex.sx.lib:db2jcc_license_cu", version.ref = "db2-license" }
mariadb-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }

# JAXB & XML
jaxb-activation = { module = "javax.activation:activation", version = "1.1.1" }
jaxb-api = { module = "javax.xml.bind:jaxb-api", version.ref = "jaxb-api" }
jaxb-core = { module = "com.sun.xml.bind:jaxb-core", version.ref = "jaxb-api" }
jaxb-impl = { module = "com.sun.xml.bind:jaxb-impl", version.ref = "jaxb-api" }
jaxb-xjc = { module = "org.glassfish.jaxb:jaxb-xjc", version.ref = "jaxb-impl" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime", version.ref = "jaxb-impl" }
woodstox-stax2 = { module = "org.codehaus.woodstox:stax2-api", version.ref = "woodstox-stax2" }
woodstox-core = { module = "org.codehaus.woodstox:woodstox-core-lgpl", version.ref = "woodstox-core" }

# Other Libraries
jackcess = { module = "com.healthmarketscience.jackcess:jackcess", version.ref = "jackcess" }
json-simple = { module = "com.googlecode.json-simple:json-simple", version.ref = "json-simple" }
jts-core = { module = "com.vividsolutions:jts-core", version.ref = "jts-core" }
msv-core = { module = "net.java.dev.msv:msv-core", version.ref = "msv-core" }
xsdlib = { module = "net.java.dev.msv:xsdlib", version.ref = "xsdlib" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

# JavaFX
javafx-base-win = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-base-mac = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-base-linux = { module = "org.openjfx:javafx-base", version.ref = "javafx" }
javafx-controls-win = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-controls-mac = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-controls-linux = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-fxml-win = { module = "org.openjfx:javafx-fxml", version.ref = "javafx" }
javafx-fxml-mac = { module = "org.openjfx:javafx-fxml", version.ref = "javafx" }
javafx-fxml-linux = { module = "org.openjfx:javafx-fxml", version.ref = "javafx" }
javafx-graphics-win = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafx-graphics-mac = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
javafx-graphics-linux = { module = "org.openjfx:javafx-graphics", version.ref = "javafx" }
materialfx = { module = "org.glavo.materialfx:materialfx", version.ref = "materialfx" }

# Test Libraries
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
hamcrest-core = { module = "org.hamcrest:hamcrest-core", version.ref = "hamcrest" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

# Testcontainers
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-db2 = { module = "org.testcontainers:db2", version.ref = "testcontainers" }
testcontainers-mssql = { module = "org.testcontainers:mssqlserver", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:mariadb", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-oracle = { module = "org.testcontainers:oracle-xe", version.ref = "testcontainers" }

# Jackson
jackson-dataformat-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml", version.ref = "jackson" }
jackson-datatype-jdk8 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jdk8", version.ref = "jackson" }

# Other
mslinks = { module = "com.github.vatbub:mslinks", version.ref = "mslinks" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
testfx-core = { module = "org.testfx:testfx-core", version.ref = "testfx" }
testfx-junit5 = { module = "org.testfx:testfx-junit5", version.ref = "testfx" }
testfx-monocle = { module = "org.testfx:openjfx-monocle", version = "jdk-12.0.1+2" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]
axion-release = { id = "pl.allegro.tech.build.axion-release", version.ref = "axion-release" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok-plugin" }
beryx-runtime = { id = "org.beryx.runtime", version.ref = "beryx-runtime" }
asciidoctor-convert = { id = "org.asciidoctor.jvm.convert", version.ref = "asciidoctor" }
asciidoctor-pdf = { id = "org.asciidoctor.jvm.pdf", version.ref = "asciidoctor" }
plantuml = { id = "com.cosminpolifronie.gradle.plantuml", version.ref = "plantuml" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
