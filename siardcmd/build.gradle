plugins {
    id 'application'
    id 'java-library'
    id 'io.freefair.lombok' version '6.5.0'
}

description = 'SIARD Command Line Tools'

def siardVersion = "2.2"
def generatedResourcesDir = file("${buildDir}/generated/resources")

sourceSets {
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.test.runtimeClasspath
    }
}

dependencies {
    implementation 'org.apache.tika:tika-core:2.9.1'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'commons-logging:commons-logging:1.1.3'
    implementation 'ch.qos.logback:logback-classic:1.5.18'
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.9'

    api 'ch.admin.bar:siard-api:v2.2.136'
    api 'ch.admin.bar:SqlParser:v2.2.4'
    api 'ch.admin.bar:Zip64File:v2.2.5'
    api 'ch.admin.bar:enterutilities:v2.2.5'
    api 'ch.admin.bar:jdbc-base:v2.2.11'
    api 'ch.admin.bar:JdbcPostgres:v2.2.4'
    api 'ch.admin.bar:jdbcoracle:v2.2.8'
    api 'ch.admin.bar:jdbcmssql:v2.2.5'
    api 'ch.admin.bar:jdbc-mysql:v2.2.5'
    api 'ch.admin.bar:jdbc-access:v2.2.4'
    api 'ch.admin.bar:jdbc-db2:v2.2.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.15.2'
    testImplementation 'org.mockito:mockito-core:5.19.0'

    testImplementation 'org.testcontainers:testcontainers:1.19.0'
    testImplementation 'org.testcontainers:mssqlserver:1.19.0'
    testImplementation 'org.testcontainers:postgresql:1.19.0'
    testImplementation 'org.testcontainers:mysql:1.19.0'
    testImplementation 'org.testcontainers:mariadb:1.19.6'
    testImplementation 'org.mariadb.jdbc:mariadb-java-client:2.7.4'
    testImplementation 'org.testcontainers:oracle-xe:1.19.0'
    testImplementation 'org.testcontainers:db2:1.19.0'

    testImplementation platform('org.junit:junit-bom:5.13.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.13.1'
}

tasks.withType(JavaExec) {
    jvmArgs = ['-Djavax.xml.parsers.SAXParserFactory=com.sun.org.apache.xerces.internal.jaxp.SAXParserFactoryImpl']
}

tasks.withType(Test) {
    jvmArgs = ['-Djavax.xml.parsers.SAXParserFactory=com.sun.org.apache.xerces.internal.jaxp.SAXParserFactoryImpl']
}

task integrationTest(type: Test) {
    description = 'Runs the integration tests'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    mustRunAfter test
    useJUnitPlatform()
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

task createVersionsPropertiesFile {
    description = 'Creates a properties file which contains all needed versions information'
    group = 'build'

    doLast {
        generatedResourcesDir.mkdirs()
        def file = new File(generatedResourcesDir, 'versions.properties')
        if (!file.exists()) {
            file.createNewFile()
            logger.info("$file successfully created")
        }

        file.withWriter { writer ->
            def properties = new Properties()
            properties['SIARD-Version'] = siardVersion.toString()
            properties['App-Version'] = project.version.toString()
            properties.store(writer, null)

            logger.info("$file successfully generated (SIARD: $siardVersion, App: ${project.version})")
        }
    }
}

compileJava {
    dependsOn createVersionsPropertiesFile
}

processResources {
    from generatedResourcesDir
    logger.info("$generatedResourcesDir added to processed resources")
}

distributions {
    main {
        contents {
            from(projectDir) {
                into ''
                include 'LICENSE.txt', 'RELEASE.txt'
            }

            from("$projectDir/testfiles/siardarchives") {
                into 'testfiles'
                include 'sample.siard'
            }

            from("$projectDir/etc") {
                into 'etc'
                exclude 'debug.properties'
            }

            from("$projectDir/doc") {
                into 'doc'
                exclude '/manual/developer'
            }

            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}

task createSiardToDbStartScript(type: CreateStartScripts) {
    mainClass = 'ch.admin.bar.siard2.cmd.SiardToDb'
    applicationName = 'siard-to-db'
    outputDir = file("${buildDir}/scripts")
    classpath = files(tasks.jar.archiveFile, configurations.runtimeClasspath)
}

tasks.withType(CreateStartScripts).configureEach {
    doLast {
        def jvmArgsLine = '-Djavax.xml.parsers.SAXParserFactory=com.sun.org.apache.xerces.internal.jaxp.SAXParserFactoryImpl'

        unixScript.text = unixScript.text.replace(
            'DEFAULT_JVM_OPTS=""',
            "DEFAULT_JVM_OPTS=\"$jvmArgsLine\""
        )

        windowsScript.text = windowsScript.text.replace(
            'set DEFAULT_JVM_OPTS=',
            "set DEFAULT_JVM_OPTS=$jvmArgsLine"
        )
    }
}

startScripts {
    mainClass = 'ch.admin.bar.siard2.cmd.SiardFromDb'
    applicationName = 'siard-from-db'
    dependsOn createSiardToDbStartScript
}

installDist {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

distZip {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

distTar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
