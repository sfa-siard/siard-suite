# loopback only, in every profile (Quarkus' prod default would be 0.0.0.0); design D3
quarkus.http.host=127.0.0.1
# the operating system assigns a free port per launch; dev mode uses a fixed one for the Vite proxy
quarkus.http.port=0
%dev.quarkus.http.port=8080
quarkus.http.test-port=0

# fixed credentials so the browser session survives hot restarts; only honoured under
# LaunchMode.DEVELOPMENT, never in the packaged app (design D8). These values are public.
%dev.siard.agent.dev-token=dev-token
%dev.siard.agent.dev-session-secret=dev-session-secret

# OpenAPI description (design D11): written to build/openapi/ on every build and at quarkusDev
# startup; openApiCheck compares it with the committed ../openapi.yaml, openApiUpdate copies it
# there. No build- or environment-dependent values, so the comparison only sees API changes:
# the API is unversioned (D10), so info.version is a constant, and no servers entries.
quarkus.smallrye-openapi.store-schema-directory=build/openapi
quarkus.smallrye-openapi.info-title=SIARD Suite local agent API
quarkus.smallrye-openapi.info-version=1
quarkus.smallrye-openapi.auto-add-server=false
